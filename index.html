<title>行銷管理課程前測問卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ───────────────────────────────────────────────
   Design tokens — Apple Human Interface Guidelines
   系統色、分隔線、材質模糊皆取自 iOS 17 規範值
   ─────────────────────────────────────────────── */
:root{
  color-scheme: light;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", "Roboto Mono", Menlo, monospace;

  --ground:#F2F2F7;
  --surface:#FFFFFF;
  --ink:#1D1D1F;
  --ink-2:#6E6E73;
  --ink-3:#8E8E93;
  --sep:rgba(60,60,67,.16);
  --fill:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.06);
  --thumb:#FFFFFF;
  --thumb-shadow:0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
  --bar:rgba(242,242,247,.82);
  --accent:#007AFF;
  --accent-soft:rgba(0,122,255,.12);
  --on-accent:#FFFFFF;
  --warn:#FF9500;
  --danger:#FF3B30;
  --card-shadow:0 1px 2px rgba(0,0,0,.05);

  /* 九個構面的識別色（Apple system colors） */
  --h1:#007AFF; --h2:#5856D6; --h3:#AF52DE; --h4:#FF2D55; --h5:#FF9500;
  --h6:#34C759; --h7:#30B0C7; --h8:#00C7BE; --h9:#A2845E;

  --spring:cubic-bezier(.32,.72,0,1);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#000000;
    --surface:#1C1C1E;
    --ink:#F5F5F7;
    --ink-2:#98989D;
    --ink-3:#8E8E93;
    --sep:rgba(84,84,88,.55);
    --fill:rgba(118,118,128,.24);
    --fill-2:rgba(118,118,128,.14);
    --thumb:#636366;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.4);
    --bar:rgba(20,20,22,.8);
    --accent:#0A84FF;
    --accent-soft:rgba(10,132,255,.18);
    --warn:#FF9F0A;
    --danger:#FF453A;
    --card-shadow:none;
    --h1:#0A84FF; --h2:#5E5CE6; --h3:#BF5AF2; --h4:#FF375F; --h5:#FF9F0A;
    --h6:#30D158; --h7:#40C8E0; --h8:#63E6E2; --h9:#AC8E68;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#000000;
  --surface:#1C1C1E;
  --ink:#F5F5F7;
  --ink-2:#98989D;
  --ink-3:#8E8E93;
  --sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24);
  --fill-2:rgba(118,118,128,.14);
  --thumb:#636366;
  --thumb-shadow:0 3px 8px rgba(0,0,0,.4);
  --bar:rgba(20,20,22,.8);
  --accent:#0A84FF;
  --accent-soft:rgba(10,132,255,.18);
  --warn:#FF9F0A;
  --danger:#FF453A;
  --card-shadow:none;
  --h1:#0A84FF; --h2:#5E5CE6; --h3:#BF5AF2; --h4:#FF375F; --h5:#FF9F0A;
  --h6:#30D158; --h7:#40C8E0; --h8:#63E6E2; --h9:#AC8E68;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font);
  font-size:17px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;margin:0}
p{margin:0}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
input,textarea{font:inherit;color:inherit}

/* ─── Navigation bar（材質模糊 + 進度軌） ─── */
.nav{
  position:sticky;
  top:env(safe-area-inset-top, 0px);
  z-index:40;
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
}
.nav-inner{
  max-width:680px;margin:0 auto;
  height:48px;padding:0 8px;
  display:grid;grid-template-columns:96px 1fr 96px;align-items:center;
}
.nav-title{
  text-align:center;font-size:15px;font-weight:600;
  opacity:0;transform:translateY(4px);
  transition:opacity .22s ease, transform .22s ease;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav.is-scrolled .nav-title{opacity:1;transform:none}
.nav-back{
  display:inline-flex;align-items:center;gap:1px;
  background:none;border:0;padding:6px 8px;border-radius:8px;
  color:var(--accent);font-size:15px;cursor:pointer;white-space:nowrap;
}
.nav-back[hidden]{display:none}
.nav-back:active{opacity:.4}
.nav-count{
  justify-self:end;padding-right:8px;
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
  color:var(--ink-3);letter-spacing:.02em;
}
.rail{height:2px;background:var(--sep)}
.rail-fill{
  height:100%;width:0%;background:var(--hue, var(--accent));
  transition:width .5s var(--spring), background-color .4s ease;
}

/* ─── Screen 版面 ─── */
.stage{max-width:680px;margin:0 auto;padding:0 20px 140px}
.screen{padding-top:20px}
.screen.enter{animation:push .42s var(--spring) both}
.screen.enter-back{animation:pop .42s var(--spring) both}
@keyframes push{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

.eyebrow{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;
  color:var(--hue, var(--accent));text-transform:uppercase;
  margin-bottom:10px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.large-title{font-size:32px;line-height:1.24;letter-spacing:-.3px;margin-bottom:8px}
.lede{color:var(--ink-2);font-size:15px;line-height:1.65;margin-bottom:24px}
.lede strong{color:var(--ink);font-weight:600}

/* ─── Inset grouped list（iOS 設定式清單） ─── */
.group{margin:0 0 26px}
.group-label{
  font-size:13px;color:var(--ink-2);font-weight:400;
  padding:0 16px 7px;letter-spacing:.01em;
}
.group-footer{font-size:13px;color:var(--ink-3);padding:8px 16px 0;line-height:1.5}
.card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--card-shadow);
  overflow:hidden;
}
.row{
  display:flex;align-items:center;gap:12px;
  width:100%;text-align:start;
  padding:13px 16px;
  background:none;border:0;cursor:pointer;
  position:relative;
  font-size:17px;
}
.row + .row::before{
  content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);
}
.row:active{background:var(--fill-2)}
.row-text{flex:1;line-height:1.45}
.row-note{font-size:13px;color:var(--ink-3);margin-top:2px}
.check{
  width:22px;height:14px;flex:none;color:var(--accent);
  opacity:0;transform:scale(.6);
  transition:opacity .18s ease, transform .3s var(--spring);
}
.row[aria-checked="true"] .check,.row[aria-selected="true"] .check{opacity:1;transform:none}
.row[aria-checked="true"] .row-text{font-weight:500}

.field{padding:6px 16px 12px}
.field input,.field textarea{
  width:100%;background:var(--fill-2);border:1px solid var(--sep);
  border-radius:10px;padding:11px 13px;resize:vertical;
  line-height:1.6;transition:border-color .16s ease, background-color .16s ease;
}
.field textarea{min-height:104px}
.field input:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.field-hint{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.field-hint .count{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ─── 量表題項 ─── */
.legend{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 16px;background:var(--fill-2);
  font-size:12px;color:var(--ink-2);
  border-bottom:1px solid var(--sep);
}
.legend b{color:var(--hue);font-family:var(--mono);font-weight:500}
.item{padding:16px 16px 12px;position:relative}
.item + .item::before{
  content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--sep);
}
.item-head{display:flex;gap:10px;margin-bottom:12px}
.item-no{
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
  padding-top:4px;font-variant-numeric:tabular-nums;flex:none;
}
.item-text{font-size:16px;line-height:1.6;flex:1}
.item.miss{background:color-mix(in srgb, var(--warn) 9%, transparent)}
.item.miss::after{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--warn);
}
.group.miss .card{box-shadow:0 0 0 1.5px var(--warn)}
.group.miss .group-label{color:var(--warn)}
.shake{animation:shake .4s ease}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(4px)} 50%{transform:translateX(-4px)}
}

/* Segmented control */
.seg{
  position:relative;display:grid;grid-template-columns:repeat(5,1fr);
  padding:3px;background:var(--fill);border-radius:10px;
}
.seg-thumb{
  position:absolute;top:3px;bottom:3px;left:3px;
  width:calc((100% - 6px) / 5);
  background:var(--thumb);border-radius:8px;box-shadow:var(--thumb-shadow);
  transform:translateX(calc(var(--i, 0) * 100%));
  transition:transform .32s var(--spring), opacity .18s ease;
  opacity:0;pointer-events:none;
}
.seg[data-value] .seg-thumb{opacity:1}
.seg-opt{
  position:relative;z-index:1;
  background:none;border:0;padding:9px 0;cursor:pointer;
  font-family:var(--mono);font-size:15px;font-weight:400;color:var(--ink-2);
  border-radius:8px;
  transition:color .18s ease, font-weight .18s ease;
}
.seg-opt::before{
  content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--sep);
  opacity:1;transition:opacity .18s ease;
}
.seg-opt:first-child::before,.seg-opt.hide-divider::before,.seg-opt[aria-checked="true"]::before{opacity:0}
.seg-opt[aria-checked="true"]{color:var(--hue, var(--accent));font-weight:500}
.seg-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg-opt:active{transform:scale(.96)}
.item-answer{
  min-height:18px;margin-top:6px;text-align:center;
  font-size:13px;color:var(--hue, var(--accent));font-weight:500;
  opacity:0;transition:opacity .2s ease;
}
.item-answer.on{opacity:1}

/* ─── 同意書 ─── */
.consent{padding:18px 18px 20px;font-size:15px;line-height:1.85;color:var(--ink-2)}
.consent p{margin:0 0 14px}
.consent p:last-child{margin:0}
.consent strong{color:var(--ink);font-weight:600}
.switch-row{display:flex;align-items:center;gap:14px;padding:14px 16px}
.switch-row .row-text{font-size:16px;font-weight:500}
.switch{
  flex:none;width:51px;height:31px;border-radius:16px;border:0;padding:2px;
  background:var(--fill);cursor:pointer;position:relative;
  transition:background-color .28s var(--spring);
}
.switch[aria-checked="true"]{background:#34C759}
.switch .knob{
  display:block;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.06);
  transform:translateX(0);
  transition:transform .28s var(--spring);
}
.switch[aria-checked="true"] .knob{transform:translateX(20px)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ─── 情境卡 ─── */
.scenario{
  padding:18px;background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--card-shadow);
  border-inline-start:3px solid var(--hue);
  font-size:16px;line-height:1.75;margin-bottom:20px;
}
.scenario .tag{
  display:inline-block;margin-bottom:8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--hue);
}

/* ─── 檢查頁 ─── */
.review-row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;background:none;border:0;text-align:start;cursor:pointer;position:relative}
.review-row + .review-row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep)}
.review-row:active{background:var(--fill-2)}
.pill{
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
  padding:3px 9px;border-radius:20px;background:var(--fill);color:var(--ink-2);flex:none;
}
.pill.done{background:color-mix(in srgb, #34C759 16%, transparent);color:#1f8f3d}
:root[data-theme="dark"] .pill.done{color:#30D158}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.done{color:#30D158}}
.pill.todo{background:color-mix(in srgb, var(--warn) 18%, transparent);color:#a86000}
:root[data-theme="dark"] .pill.todo{color:var(--warn)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.todo{color:var(--warn)}}
.chev{width:8px;height:13px;flex:none;color:var(--ink-3);opacity:.6}

/* ─── 完成頁 ─── */
.finish{text-align:center;padding:34px 0 8px}
.tick{width:84px;height:84px;margin-bottom:20px}
.tick circle{fill:none;stroke:#34C759;stroke-width:3;opacity:.22}
.tick path{
  fill:none;stroke:#34C759;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:48;stroke-dashoffset:48;
  animation:draw .55s var(--spring) .18s forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;position:relative}
.stat-row + .stat-row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep)}
.stat-row .k{color:var(--ink-2);font-size:15px}
.stat-row .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}

/* ─── 底部工具列 ─── */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
@media (min-width:600px){
  .bar-inner{max-width:420px}
}
.btn{
  width:100%;border:0;border-radius:12px;padding:15px 20px;
  font-size:17px;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--on-accent);
  transition:transform .2s var(--spring), opacity .2s ease, background-color .2s ease;
}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.ghost{background:var(--fill);color:var(--accent)}
.bar-hint{text-align:center;font-size:12px;color:var(--ink-3)}

/* ─── Toast ─── */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom, 0px));
  transform:translate(-50%, 14px);
  z-index:60;max-width:calc(100% - 40px);
  padding:11px 18px;border-radius:22px;
  background:rgba(28,28,30,.92);color:#fff;font-size:14px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 8px 28px rgba(0,0,0,.24);
  opacity:0;pointer-events:none;
  transition:opacity .24s ease, transform .3s var(--spring);
}
:root[data-theme="dark"] .toast{background:rgba(58,58,60,.94)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:rgba(58,58,60,.94)}}
.toast.on{opacity:1;transform:translate(-50%, 0)}

.notice{
  display:flex;gap:11px;padding:14px 16px;border-radius:12px;
  background:color-mix(in srgb, var(--danger) 10%, transparent);
  color:var(--danger);font-size:14px;line-height:1.6;margin-bottom:18px;
}
.notice.info{background:var(--fill-2);color:var(--ink-2)}

@media (max-width:420px){
  .large-title{font-size:28px}
  .item-text{font-size:15.5px}
  .seg-opt{font-size:14px;padding:8px 0}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

<header class="nav" id="nav">
  <div class="nav-inner">
    <button class="nav-back" id="back" hidden aria-label="上一步">
      <svg width="11" height="18" viewBox="0 0 11 18" aria-hidden="true"><path d="M9.5 1.5 2 9l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      上一步
    </button>
    <div class="nav-title" id="navTitle">行銷管理課程前測問卷</div>
    <div class="nav-count" id="navCount"></div>
  </div>
  <div class="rail"><div class="rail-fill" id="rail"></div></div>
</header>

<main class="stage" id="stage"></main>

<footer class="bar" id="bar">
  <div class="bar-inner">
    <button class="btn" id="primary">開始填答</button>
    <div class="bar-hint" id="barHint">作答進度會自動保存在這台裝置</div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ═══════════════════════════════════════════════
   可調整參數（對應 Google Apps Script 版本）
   ═══════════════════════════════════════════════ */
const FORM_TITLE = "行銷管理課程問卷（前測）V3";
const FORM_VERSION = "V3";
const CONTACT_EMAIL = "（請填入聯絡信箱）";   // ← 發放前務必填入真實信箱
const SHOW_ITEM_CODES = false;               // true = 題目前顯示 IM1／TD1 等代碼
const SHOW_CONSTRUCT_NAMES = false;          // true = 顯示「內在動機」等構面名稱

const LIKERT = ["非常不同意", "不同意", "普通", "同意", "非常同意"];

const CONSENT = [
  "親愛的同學，您好：",
  "本問卷為教育部教學實踐研究計畫之基線調查，由世新大學企業管理學系林建江助理教授主持。本調查目的在了解您在課程開始前的學習狀況與生成式 AI 工具使用經驗，作為課程設計改善的參考依據。",
  "參與本調查完全出於自願，您可以隨時停止填答，不參與或中途退出均不會影響您的課程成績或與授課教師的關係。",
  "本研究為前後測設計，因此需要蒐集您的電子郵件，用途僅限於三項：將您期初與期末的填答配對、避免同一人重複填答，以及在您勾選時寄送一份填答副本給您。填答資料儲存於計畫主持人管理的 Google 試算表，僅研究團隊可存取；進行分析前會以編號取代電子郵件，個人資訊絕不對外揭露，僅供本計畫學術研究使用。研究成果若公開發表，不會出現任何可辨識個人身份的資料。",
  "若您對本研究有任何疑問，歡迎聯絡計畫主持人：林建江助理教授，電子郵件：" + CONTACT_EMAIL + "。",
  "問卷填答約需 15 分鐘，感謝您撥冗填答！"
];

/* ═══════════════════════════════════════════════
   題庫
   ═══════════════════════════════════════════════ */
const BG_GROUPS = [
  { label:"A・個人基本資料", qs:[
    { id:"A1", title:"性別", type:"single", options:["男","女","其他","不願透露"] },
    { id:"A2", title:"年級", type:"single", options:["一年級","二年級","三年級","四年級","研究生"] },
    { id:"A3", title:"科系", type:"text", placeholder:"請填寫您的系所名稱" }

const HAS_GAS = typeof google !== "undefined" && google.script && google.script.run;
function gasCall(fn, arg){
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
  });
}

function newId(){
  if (self.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && saved.rid && saved.items) state = Object.assign(blank(), saved);
    if (state.screen >= SCREENS.length - 1) state.screen = SCREENS.length - 2;
  }catch(e){ /* 草稿毀損就重新開始 */ }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function clearDraft(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}

function answeredCount(){
  let n = BG_IDS.filter(id => filled(id)).length;
  n += Object.keys(state.items).length;
  if (isEmail(state.email)) n += 1;
  return n;
}
function isEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || "").trim());
}
function filled(id){
  const v = state.bg[id];
  if (Array.isArray(v)) return v.length > 0;
  return typeof v === "string" ? v.trim() !== "" : v != null;
}
function scaleDone(i){
  return SCALES[i].items.every(it => state.items[it[0]] != null);
}
function bgGroupDone(g){
  return BG_GROUPS[g].qs.every(q => filled(q.id));
}
function fmtDuration(sec){
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m > 0 ? m + " 分 " + String(s).padStart(2, "0") + " 秒" : s + " 秒";
}
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}

function renderQuestion(q){
  const label = '<div class="group-label">' + esc(q.title) + (q.note ? "（" + esc(q.note) + "）" : "") +
    (q.help ? '<div style="margin-top:3px;color:var(--ink-3)">' + esc(q.help) + "</div>" : "") + "</div>";
  let body = "";

  if (q.type === "single" || q.type === "multi"){
    const current = state.bg[q.id];
    const isOn = opt => q.type === "multi"
      ? Array.isArray(current) && current.includes(opt)
      : current === opt;

    body = q.options.map(opt =>
      '<button class="row" role="' + (q.type === "multi" ? "checkbox" : "radio") + '" aria-checked="' + (isOn(opt) ? "true" : "false") +
      '" data-act="opt" data-q="' + q.id + '" data-multi="' + (q.type === "multi") + '" data-v="' + esc(opt) + '">' +
      '<span class="row-text">' + esc(opt) + "</span>" + CHECK_SVG + "</button>"
    ).join("");

    if (q.other){
      const on = isOn("其他");
      body += '<button class="row" role="checkbox" aria-checked="' + (on ? "true" : "false") +
        '" data-act="opt" data-q="' + q.id + '" data-multi="true" data-v="其他">' +
        '<span class="row-text">其他</span>' + CHECK_SVG + "</button>";
      if (on){
        body += '<div class="field"><input type="text" id="other-' + q.id + '" data-act="other" data-q="' + q.id +
          '" value="' + esc(state.other[q.id] || "") + '" placeholder="請說明" aria-label="其他，請說明"></div>';
      }
    }
  } else if (q.type === "text"){
    body = '<div class="field" style="padding-top:12px"><input type="text" id="f-' + q.id + '" data-act="txt" data-q="' + q.id +
      '" value="' + esc(state.bg[q.id] || "") + '" placeholder="' + esc(q.placeholder || "") + '" aria-label="' + esc(q.title) + '"></div>';
  } else {
    const v = state.bg[q.id] || "";
    body = '<div class="field" style="padding-top:12px"><textarea id="f-' + q.id + '" data-act="txt" data-q="' + q.id +
      '" placeholder="' + esc(q.placeholder || "") + '" aria-label="' + esc(q.title) + '">' + esc(v) + "</textarea></div>";
  }

  return '<div class="group" id="q-' + q.id + '">' + label + '<div class="card">' + body + "</div></div>";
}

        ).join("") +
      "</div>" +
      '<div class="item-answer' + (v ? " on" : "") + '" data-answer="' + code + '">' + (v ? esc(v + "　" + LIKERT[v - 1]) : "") + "</div>" +
      "</div>";
  }).join("");

  return '<div style="--hue:' + h + '">' +
    titleBlock(eyebrow, heading, "本量表沒有正確或錯誤答案，請依第一直覺誠實作答。每題均請作答，請勿遺漏。", h) +
    '<div class="group"><div class="card">' +
      '<div class="legend" style="--hue:' + h + '"><span><b>1</b>　非常不同意</span><span><b>5</b>　非常同意</span></div>' +
      items +
    "</div><div class=\"group-footer\">1 非常不同意　2 不同意　3 普通　4 同意　5 非常同意</div></div></div>";
}

function renderSJ(sc){
  const h = "var(--h9)";
  const len = (state.sj || "").length;
  return '<div style="--hue:' + h + '">' +
    titleBlock(sc.part + "・選填", sc.title, "這題不計分、也可以留白。請以 2 至 4 句話描述你的處理方式。", h) +
    '<div class="scenario"><span class="tag">SCENARIO</span><br>' + esc(SJ_PROMPT) + "</div>" +
    '<div class="group"><div class="card"><div class="field" style="padding-top:14px">' +
      '<textarea id="sj" data-act="sj" placeholder="我會先……" aria-label="情境判斷作答">' + esc(state.sj || "") + "</textarea>" +
      '<div class="field-hint"><span>選填，可略過</span><span class="count" id="sjCount">' + len + " 字</span></div>" +
    "</div></div></div></div>";
}

function renderReview(sc){
  const rows = [];
  SCREENS.forEach((s, i) => {
    if (s.kind === "email"){
      rows.push({ i, label:"電子郵件", done:isEmail(state.email), text:isEmail(state.email) ? "已填寫" : "未填寫" });
    } else if (s.kind === "bg"){
      const done = s.groups.every(bgGroupDone);
      const total = s.groups.reduce((n, g) => n + BG_GROUPS[g].qs.length, 0);
      const got = s.groups.reduce((n, g) => n + BG_GROUPS[g].qs.filter(q => filled(q.id)).length, 0);
      rows.push({ i, label:s.nav, done, text:got + " / " + total });
    } else if (s.kind === "scale"){
      const items = SCALES[s.index].items;
      const got = items.filter(it => state.items[it[0]] != null).length;
      rows.push({ i, label:"量表 " + String(s.index + 1).padStart(2, "0") +
        (SHOW_CONSTRUCT_NAMES ? "　" + SCALES[s.index].name : ""), done:got === items.length, text:got + " / " + items.length });
    } else if (s.kind === "sj"){
      rows.push({ i, label:"情境判斷（選填）", done:true, text:(state.sj || "").trim() ? "已填寫" : "略過" });
    }
  });

  const missing = rows.filter(r => !r.done).length;
  const list = rows.map(r =>
    '<button class="review-row" data-act="goto" data-i="' + r.i + '">' +
    '<span class="row-text">' + esc(r.label) + "</span>" +
    '<span class="pill ' + (r.done ? "done" : "todo") + '">' + esc(r.text) + "</span>" + CHEV_SVG + "</button>"
  ).join("");

  const lede = missing === 0
    ? "所有必答題都完成了。送出後將無法修改。"
    : "還有 <strong>" + missing + " 個段落</strong>未完成，點一下可直接跳過去補答。";

  return titleBlock(sc.part, sc.title, lede, "var(--h6)") +
    (missing === 0 ? "" : '<div class="notice"><span>未完成的段落無法送出，請先補齊必答題。</span></div>') +
    '<div class="group"><div class="card">' + list + "</div>" +
      '<div class="group-footer">送出後，您的作答將以匿名形式儲存，僅供本計畫學術研究使用。</div></div>';
}

function renderDone(){
  const stored = state.saved === "sheet" || state.saved === "cloud";
  const mode = stored ? "已送出並儲存" : "已在這台裝置完成";
  let note;
  if (state.saved === "sheet"){
    note = "感謝您撥冗填答，您的作答已寫入計畫的資料表。" +
      (state.copySent ? "填答副本已寄至您的信箱。" : (state.emailCopy ? "副本寄送未成功，但作答已完整記錄。" : ""));
  } else if (state.saved === "cloud"){
    note = "感謝您撥冗填答。您的作答已送出，分析時會以編號取代電子郵件。";
  } else {
    note = "本次填答未能連上儲存服務，資料僅保留在這台裝置。請下載備份，或改由表單連結重新送出。";
  }

  return '<div class="finish">' +
      '<svg class="tick" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="33"/><path d="M22 37.5 32 47 50 26.5"/></svg>' +
      '<h1 class="large-title">' + esc(mode) + "</h1>" +
      '<p class="lede" style="margin-bottom:26px">' + esc(note) + "</p>" +
    "</div>" +
    '<div class="group"><div class="card">' +
      statRow("電子郵件", state.email || "—") +
      statRow("作答題數", answeredCount() + " / " + TOTAL_REQUIRED) +
      statRow("情境判斷", (state.sj || "").trim() ? (state.sj.trim().length + " 字") : "略過") +
      statRow("填答時間", fmtDuration(state.elapsed)) +
      statRow("紀錄編號", state.rid.slice(0, 8)) +
    "</div><div class=\"group-footer\">若對本研究有任何疑問，請聯絡計畫主持人林建江助理教授：" + esc(CONTACT_EMAIL) + "</div></div>";
}
function statRow(k, v){
  return '<div class="stat-row"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + "</span></div>";
}

/* ═══════════════════════════════════════════════
   繪製與導覽
   ═══════════════════════════════════════════════ */
function render(){
  const sc = SCREENS[state.screen];
  const stage = $("stage");
  let html = "";

  if (sc.kind === "welcome") html = renderWelcome();
  else if (sc.kind === "email") html = renderEmail(sc);
  else if (sc.kind === "bg") html = renderBG(sc);
  else if (sc.kind === "scale") html = renderScale(sc);
  else if (sc.kind === "sj") html = renderSJ(sc);
  else if (sc.kind === "review") html = renderReview(sc);
  else html = renderDone();

  stage.innerHTML = '<section class="screen ' + (dir === "back" ? "enter-back" : "enter") + '">' + html + "</section>";
  window.scrollTo(0, 0);

  $("navTitle").textContent = sc.nav;
  $("back").hidden = !(state.screen > 0 && sc.kind !== "done");

  const pct = Math.round(answeredCount() / TOTAL_REQUIRED * 100);
  $("rail").style.width = (sc.kind === "done" ? 100 : pct) + "%";
  $("rail").style.setProperty("--hue", sc.kind === "scale" ? hue(sc.index) : "var(--accent)");
  $("navCount").textContent = sc.kind === "welcome" ? "" : (sc.kind === "done" ? "100%" : pct + "%");

  const btn = $("primary"), hint = $("barHint"), bar = $("bar");
  bar.hidden = false;
  btn.hidden = false;
  if (sc.kind === "welcome"){
    btn.textContent = "開始填答";
    btn.disabled = !state.consent;
    btn.className = "btn";
    hint.textContent = state.consent ? "作答進度會自動保存在這台裝置" : "請先閱讀說明並開啟同意選項";
  } else if (sc.kind === "review"){
    btn.textContent = "送出問卷";
    btn.disabled = false;
    btn.className = "btn";
    hint.textContent = "送出後將無法再修改";
  } else if (sc.kind === "done"){
    if (HAS_GAS){
      btn.hidden = true;
      hint.textContent = state.copySent ? "副本已寄至 " + state.email : "您可以關閉此頁面了";
    } else {
      btn.textContent = "下載我的填答備份";
      btn.disabled = false;
      btn.className = "btn ghost";
      hint.textContent = "僅供您自行留存，供您與研究團隊核對之用";
    }
  } else {
    btn.textContent = "繼續";
    btn.disabled = false;
    btn.className = "btn";
    hint.textContent = "作答進度會自動保存在這台裝置";
  }

  save();
}

function go(to, how){
  dir = how || (to > state.screen ? "fwd" : "back");
  state.screen = Math.max(0, Math.min(SCREENS.length - 1, to));
  render();
}

function validate(){
  const sc = SCREENS[state.screen];
  let missingIds = [];

  if (sc.kind === "email"){
    if (!isEmail(state.email)) missingIds.push("q-email");
  } else if (sc.kind === "bg"){
    sc.groups.forEach(g => BG_GROUPS[g].qs.forEach(q => { if (!filled(q.id)) missingIds.push("q-" + q.id); }));
  } else if (sc.kind === "scale"){
    SCALES[sc.index].items.forEach(it => { if (state.items[it[0]] == null) missingIds.push("item-" + it[0]); });
  }
  if (!missingIds.length) return true;

  missingIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add("miss");
  });
  const first = document.getElementById(missingIds[0]);
  if (first){
    first.classList.add("shake");
    setTimeout(() => first.classList.remove("shake"), 450);
    const y = first.getBoundingClientRect().top + window.scrollY - 110;
    window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
  }
  toast(SCREENS[state.screen].kind === "email"
    ? "請填寫有效的電子郵件"
    : "還有 " + missingIds.length + " 題未作答");
  return false;
}

/* ═══════════════════════════════════════════════
   互動
   ═══════════════════════════════════════════════ */
$("stage").addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "likert"){
    const code = el.dataset.code, v = Number(el.dataset.v);
    state.items[code] = v;
    const seg = el.parentElement;
    seg.dataset.value = String(v);
    seg.style.setProperty("--i", v - 1);
    seg.querySelectorAll(".seg-opt").forEach((b, k) => {
      b.setAttribute("aria-checked", k + 1 === v ? "true" : "false");
      b.tabIndex = k + 1 === v ? 0 : -1;
    });
    const ans = document.querySelector('[data-answer="' + code + '"]');
    if (ans){ ans.textContent = v + "　" + LIKERT[v - 1]; ans.classList.add("on"); }
    const item = document.getElementById("item-" + code);
    if (item) item.classList.remove("miss");
    refreshProgress();
    save();
  }

  if (act === "opt"){
    const q = el.dataset.q, v = el.dataset.v, multi = el.dataset.multi === "true";
    if (multi){
      const list = Array.isArray(state.bg[q]) ? state.bg[q].slice() : [];
      const at = list.indexOf(v);
      if (at >= 0) list.splice(at, 1); else list.push(v);
      state.bg[q] = list;
      el.setAttribute("aria-checked", at >= 0 ? "false" : "true");
      const wrap = document.getElementById("q-" + q);
      if (wrap) wrap.classList.remove("miss");
      if (v === "其他"){
        if (at >= 0) delete state.other[q];
        save();
        const keep = window.scrollY;
        render();                       // 「其他」需要顯示或收起補充欄位
        window.scrollTo(0, keep);
        if (at < 0){
          const box = document.getElementById("other-" + q);
          if (box) box.focus();
        }
        return;
      }
      refreshProgress();
      save();
      return;
    }
    state.bg[q] = v;
    el.parentElement.querySelectorAll('[data-act="opt"]').forEach(b => {
      b.setAttribute("aria-checked", b === el ? "true" : "false");
    });
    const wrap = document.getElementById("q-" + q);
    if (wrap) wrap.classList.remove("miss");
    refreshProgress();
    save();
  }

  if (act === "goto") go(Number(el.dataset.i), "back");
});

$("stage").addEventListener("input", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "txt"){
    state.bg[el.dataset.q] = el.value;
    const wrap = document.getElementById("q-" + el.dataset.q);
    if (wrap) wrap.classList.remove("miss");
    refreshProgress();
  } else if (el.dataset.act === "email"){
    state.email = el.value.trim();
    const wrap = document.getElementById("q-email");
    if (wrap && isEmail(state.email)) wrap.classList.remove("miss");
    refreshProgress();
  } else if (el.dataset.act === "other"){
    state.other[el.dataset.q] = el.value;
  } else if (el.dataset.act === "sj"){
    state.sj = el.value;
    const c = $("sjCount");
    if (c) c.textContent = el.value.length + " 字";
  }
  save();
});

/* 鍵盤：方向鍵在量表內移動，1–5 直接作答 */
$("stage").addEventListener("keydown", e => {
  const opt = e.target.closest(".seg-opt");
  if (!opt) return;
  const seg = opt.parentElement;
  const opts = Array.from(seg.querySelectorAll(".seg-opt"));
  const at = opts.indexOf(opt);
  let next = -1;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") next = Math.min(opts.length - 1, at + 1);
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = Math.max(0, at - 1);
  else if (/^[1-5]$/.test(e.key)) next = Number(e.key) - 1;
  if (next < 0) return;
  e.preventDefault();
  opts[next].focus();
  opts[next].click();
});

$("stage").addEventListener("click", e => {
  const sw = e.target.closest(".switch");
  if (!sw) return;
  const on = sw.getAttribute("aria-checked") !== "true";
  sw.setAttribute("aria-checked", on ? "true" : "false");
  if (sw.id === "consentSwitch"){
    state.consent = on;
    $("primary").disabled = !on;
    $("barHint").textContent = on ? "作答進度會自動保存在這台裝置" : "請先閱讀說明並開啟同意選項";
  } else if (sw.id === "copySwitch"){
    state.emailCopy = on;
  }
  save();
});

$("back").addEventListener("click", () => go(state.screen - 1, "back"));

$("primary").addEventListener("click", () => {
  const sc = SCREENS[state.screen];
  if (sc.kind === "done") return downloadBackup();
  if (sc.kind === "review") return submit();
  if (sc.kind === "welcome" && !state.consent) return;
  if (!validate()) return;
  go(state.screen + 1, "fwd");
});

function refreshProgress(){
  const sc = SCREENS[state.screen];
  const pct = Math.round(answeredCount() / TOTAL_REQUIRED * 100);
  $("rail").style.width = pct + "%";
  if (sc.kind !== "welcome") $("navCount").textContent = pct + "%";
}

let scrollTick = false;
window.addEventListener("scroll", () => {
  if (scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(() => {
    $("nav").classList.toggle("is-scrolled", window.scrollY > 44);
    scrollTick = false;
  });
}, { passive:true });

setInterval(() => {
  const now = Date.now();
  if (now - lastTick < 60000) state.elapsed += (now - lastTick) / 1000;
  lastTick = now;
}, 5000);

/* ═══════════════════════════════════════════════
   送出
   ═══════════════════════════════════════════════ */
function buildPayload(){
  const constructs = {};
  SCALES.forEach(s => {
    const vals = s.items.map(it => state.items[it[0]]).filter(v => v != null);
    const sum = vals.reduce((a, b) => a + b, 0);
    constructs[s.code] = {
      name: s.name, en: s.en, n: vals.length,
      sum: sum, mean: vals.length ? Number((sum / vals.length).toFixed(3)) : null
    };
  });
  const bg = {};
  BG_IDS.forEach(id => {
    bg[id] = state.bg[id] == null ? null : state.bg[id];
    if (state.other[id]) bg[id + "_other"] = state.other[id];
  });
  return {
    responseId: state.rid,
    email: state.email,
    emailCopy: !!state.emailCopy,
    formTitle: FORM_TITLE,
    formVersion: FORM_VERSION,
    consent: state.consent,
    startedAt: state.startedAt,
    submittedAt: new Date().toISOString(),
    durationSec: Math.round(state.elapsed),
    background: bg,
    items: Object.assign({}, state.items),
    constructs: constructs,
    scenarioSJ1: (state.sj || "").trim(),
    completedItems: Object.keys(state.items).length,
    totalItems: TOTAL_ITEMS
  };
}

function buildRecord(){
  const cols = [], values = {}, labels = {};
  const put = (k, v, label) => { cols.push(k); values[k] = v; if (label) labels[k] = label; };

  put("填答時間", new Date().toISOString());
  put("紀錄編號", state.rid);
  put("電子郵件", state.email);
  put("同意參與", state.consent ? "是" : "否");
  put("開始時間", state.startedAt);
  put("填答秒數", Math.round(state.elapsed));

  BG_GROUPS.forEach(g => g.qs.forEach(q => {
    const v = state.bg[q.id];
    put(q.id, Array.isArray(v) ? v.join("；") : (v == null ? "" : v), q.title);
    if (q.other) put(q.id + "_其他", state.other[q.id] || "", q.title + "（其他）");
  }));
  SCALES.forEach(s => s.items.forEach(it => {
    put(it[0], state.items[it[0]] == null ? "" : state.items[it[0]], it[1]);
  }));
  SCALES.forEach(s => {
    const vals = s.items.map(it => state.items[it[0]]).filter(v => v != null);
    const mean = vals.length ? Number((vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(3)) : "";
    put(s.code + "_平均", mean, s.name + "（" + s.en + "）構面平均");
  });
  put("SJ1", (state.sj || "").trim(), "情境判斷：" + SJ_PROMPT);

  return {
    responseId: state.rid,
    email: state.email,
    sendCopy: !!state.emailCopy,
    formTitle: FORM_TITLE,
    formVersion: FORM_VERSION,
    columns: cols,
    values: values,
    labels: labels
  };
}

const SUBMIT_ERRORS = {
  duplicate: "這個信箱已經有一筆填答紀錄了",
  bad_email: "電子郵件格式不正確，請回上一步修正",
  busy: "系統忙碌中，請稍候再送出一次",
  bad_request: "送出的資料不完整，請重新整理頁面再試",
  quota_exceeded: "儲存空間已滿，請聯絡計畫主持人"
};

async function submit(){
  if (busy) return;
  if (!isEmail(state.email)){
    toast("請先填寫電子郵件");
    go(1, "back");
    return;
  }
  const incomplete = BG_IDS.some(id => !filled(id)) || Object.keys(state.items).length < TOTAL_ITEMS;
  if (incomplete){
    toast("還有必答題未完成，請先補齊");
    return;
  }
  busy = true;
  const btn = $("primary");
  btn.disabled = true;
  btn.textContent = "送出中…";

  const payload = buildPayload();
  const fail = msg => {
    busy = false;
    btn.disabled = false;
    btn.textContent = "送出問卷";
    toast(msg);
  };

  try{
    if (HAS_GAS){
      const res = await gasCall("submitResponse", buildRecord());
      if (!res || !res.ok){
        const code = res && res.code ? res.code : "server_error";
        if (code === "duplicate"){
          fail(SUBMIT_ERRORS.duplicate);
          go(1, "back");
          return;
        }
        if (code === "bad_email"){
          fail(SUBMIT_ERRORS.bad_email);
          go(1, "back");
          return;
        }
        fail(SUBMIT_ERRORS[code] || "送出失敗，您的作答已保留，請再試一次");
        return;
      }
      state.saved = "sheet";
      state.copySent = !!res.copySent;
    } else {
      const db = window.claude ? await window.claude.use("db") : null;
      if (db){
        await db.collection("responses").doc(state.rid).set(payload);
        state.saved = "cloud";
      } else {
        state.saved = "local";
      }
    }
  }catch(err){
    const code = err && err.code ? err.code : "";
    if (code === "quota_exceeded") fail(SUBMIT_ERRORS.quota_exceeded);
    else if (code === "not_granted" || code === "capability_disabled") fail("此裝置無法連上儲存服務，可改用下載備份");
    else fail("送出失敗，網路可能不穩定。您的作答已保留，請再試一次");
    return;
  }

  state.finishedPayload = payload;
  busy = false;
  clearDraft();
  go(SCREENS.length - 1, "fwd");
}

async function downloadBackup(){
  const payload = state.finishedPayload || buildPayload();
  const lines = [["欄位", "作答"]];
  lines.push(["電子郵件", state.email || ""]);
  BG_IDS.forEach(id => {
    const v = payload.background[id];
    lines.push([id, Array.isArray(v) ? v.join("；") : (v == null ? "" : String(v))]);
    if (payload.background[id + "_other"]) lines.push([id + "_其他", payload.background[id + "_other"]]);
  });
  SCALES.forEach(s => s.items.forEach(it => {
    const v = payload.items[it[0]];
    lines.push([it[0], v == null ? "" : String(v)]);
  }));
  lines.push(["SJ1", payload.scenarioSJ1]);
  lines.push(["填答時間（秒）", String(payload.durationSec)]);
  lines.push(["紀錄編號", payload.responseId]);

  const csv = "﻿" + lines.map(r =>
    r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")
  ).join("\r\n");

  const btn = $("primary");
  try{
    const downloads = window.claude ? await window.claude.use("downloads") : null;
    if (!downloads){
      btn.disabled = true;
      btn.textContent = "此裝置無法下載檔案";
      return;
    }
    await downloads.save({ filename: "行銷管理前測問卷_" + payload.responseId.slice(0, 8) + ".csv", data: csv });
    btn.textContent = "已下載備份";
  }catch(err){
    const code = err && err.code ? err.code : "unavailable";
    if (code === "declined") toast("已取消下載");
    else toast("下載失敗（" + code + "）");
  }
}

/* ═══════════════════════════════════════════════
   啟動
   ═══════════════════════════════════════════════ */
load();
render();
if (state.screen > 0 || Object.keys(state.items).length){
  setTimeout(() => toast("已回到上次填答的進度"), 450);
}
})();
</script>
